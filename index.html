:root[data-skin="bubble"][data-skin]{--bg:#102B53;--bg-img:radial-gradient(circle at 15% 20%,rgba(206,181,212,.25) 0,transparent 30%),radial-gradient(circle at 85% 70%,rgba(125,159,192,.3) 0,transparent 35%),linear-gradient(180deg,#102B53,#16335F);--surface:#16355F;--surface-2:#1D406E;--line:#3A5A86;--fg:#EEF2FA;--muted:#AFC0D8;--accent:#CEB5D4;--accent-soft:#2C4A78;--focus:#7D9FC0;--title-grad:linear-gradient(90deg,#F2E3C6,#CEB5D4 50%,#7D9FC0);--ff-display:"DM Serif Display",Georgia,serif;--ff-head:"Montserrat",system-ui,sans-serif;--ff-body:"Montserrat",system-ui,sans-serif;--fs:14px;--fx-op:.5;--rose-bg:#4C2E3A;--rose-fg:#F2B8C8;--mint-bg:#20414A;--mint-fg:#A6E0D6;--peach-bg:#4A3A22;--peach-fg:#F0D49A;--lilac-bg:#3E3460;--lilac-fg:#D6C6F2;--sage-bg:#2D4136;--sage-fg:#BCD9B4;--sky-bg:#23395A;--sky-fg:#B9CBEB;--sand-bg:#3F3730;--sand-fg:#E4D1AA;--gray-bg:#33323D;--gray-fg:#C9C6D8;--gold-bg:#4A3E22;--gold-fg:#E8D19A;--terra-bg:#4D2E30;--terra-fg:#F0B3A6;color-scheme:dark}
:root[data-skin="pixel"]{--r:0px}

/* Layout: barra superior de archivo + mesa de trabajo de dos columnas (formulario | resumen fijo) + expediente A4 imprimible.
   Mundo: archivo del Ministerio, nogal oscuro, pergamino y dorado de lacre, como los expedientes de PNJ del foro. */
/* Layout: barra superior + mesa de trabajo de dos columnas (formulario | resumen fijo) + expediente A4 imprimible.
   Color y tipografía: kit de temas de PAM (themes.css). Aquí solo se traducen esos tokens a los de la app. */
:root {
  --paper: var(--bg); --paper-2: var(--surface-2); --card: var(--surface);
  --ink: var(--fg); --ink-soft: var(--muted);
  --gold: var(--accent); --gold-soft: color-mix(in srgb, var(--accent) 55%, var(--line));
  --on-accent: var(--surface);
  --seal: var(--rose-fg); --ok: var(--mint-fg); --warn: var(--peach-fg); --bad: var(--terra-fg); --info: var(--sky-fg);
  --font-display: var(--ff-display); --font-book: var(--ff-head); --font-ui: var(--ff-body);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg-img, none), var(--bg); background-color: var(--bg); background-attachment: fixed; color: var(--ink); }
:root[data-skin="pixel"] body { background-size: 12px 12px, auto; }
body { font-family: var(--font-ui); font-size: var(--fs, 15px); line-height: 1.45; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- barra superior ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(6px); color: var(--fg); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; font-size: 17px; background: var(--title-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand span { font-family: var(--font-book); font-style: italic; color: var(--muted); font-size: 15px; }
.tabs { display: flex; gap: 4px; }
.tab { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-family: var(--font-display); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; }
.tab:hover { border-color: var(--line); color: var(--fg); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chip-conn { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip-conn.on { border-color: var(--ok); color: var(--ok); }
.icon-btn { background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: var(--r); padding: 5px 10px; cursor: pointer; font-size: 13px; }
.icon-btn:hover { border-color: var(--gold-soft); }

.wrap { max-width: 1440px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view[hidden] { display: none !important; }

/* ---------- mesa de trabajo ---------- */
.desk { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
@media (max-width: 980px) { .desk { grid-template-columns: 1fr; } .summary { position: static !important; } }
.editor { display: grid; gap: 14px; min-width: 0; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary .num { font-family: var(--font-display); color: var(--gold); font-size: 13px; letter-spacing: .1em; min-width: 2.2em; }
.sec > summary h2 { font-family: var(--font-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; margin: 0; font-weight: 600; }
.sec > summary .hint { margin-left: auto; color: var(--ink-soft); font-size: 13px; text-align: right; }
.sec > summary::after { content: "▾"; color: var(--gold); transition: transform .15s; }
.sec:not([open]) > summary::after { transform: rotate(-90deg); }
.sec-body { padding: 4px 16px 18px; display: grid; gap: 16px; border-top: 1px dashed var(--line); padding-top: 14px; }

.grid { display: grid; gap: 12px 14px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }
input[type=text], input[type=url], input[type=number], input[type=search], select, textarea {
  width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; min-width: 0; }
textarea { min-height: 76px; resize: vertical; line-height: 1.4; }
input[type=number] { font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.muted { color: var(--ink-soft); font-size: 13.5px; }
.small { font-size: 12.5px; }

.btn { border: 1px solid var(--gold); background: transparent; color: var(--ink); border-radius: var(--r); padding: 7px 13px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--paper-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn.ghost { border-color: var(--line); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* niveles segmentados */
.seg { display: inline-flex; border: 1px solid var(--gold); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 13.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.jobcard { border-left: 3px solid var(--gold); padding: 8px 12px; background: var(--paper); border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 6px; }
.jobcard .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.jobcard .meta b { color: var(--ink); font-weight: 600; }
.tag { display: inline-block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; color: var(--ink-soft); }
.tag.unof { border-color: var(--seal); color: var(--seal); }
details.notes > summary { cursor: pointer; font-size: 13px; color: var(--gold); }
details.notes ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink-soft); }

/* tablas de ajuste */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; border-bottom: 1px solid var(--line); padding: 5px 6px; }
.tbl td { border-bottom: 1px dashed var(--line); padding: 5px 6px; vertical-align: middle; }
.tbl td.n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tbl select { padding: 4px 6px; }
.scroll-x { overflow-x: auto; }
.attr-group td.g { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; color: var(--gold); padding-top: 12px; border-bottom: 0; text-transform: uppercase; }
.base-mark { font-size: 11.5px; color: var(--ink-soft); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); }
.stepper button { border: 0; background: transparent; width: 28px; height: 28px; cursor: pointer; font-size: 16px; color: var(--gold); }
.stepper button:disabled { color: var(--line); cursor: default; }
.stepper output { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.attrs-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.attr-cell { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 4px; background: var(--paper); }
.attr-cell .top { display: flex; justify-content: space-between; align-items: baseline; }
.attr-cell .top b { font-family: var(--font-display); font-size: 13px; letter-spacing: .06em; }
.tierpill { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; white-space: nowrap; border: 1px solid currentColor; }
.tier-0 { color: var(--ink-soft); } .tier-1 { color: var(--info); } .tier-2 { color: var(--ok); } .tier-3 { color: var(--warn); } .tier-4 { color: var(--bad); }

.pend { display: grid; gap: 10px; }
.pend-item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(160px, 260px); gap: 8px 14px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.pend-item.todo { border-color: var(--warn); }
.pend-item .what { font-size: 14px; }
.pend-item .what small { display: block; color: var(--ink-soft); }
@media (max-width: 560px) { .pend-item { grid-template-columns: 1fr; } }

/* arcanos */
.arc-req { display: flex; flex-wrap: wrap; gap: 8px; }
.arc-chip { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; font-size: 13px; background: var(--paper); }
.arc-chip.ok { border-color: var(--ok); }
.arc-chip.no { border-color: var(--warn); }
.arc-chip b { font-weight: 600; }
.arc-filters { display: grid; gap: 8px; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); }
@media (max-width: 640px) { .arc-filters { grid-template-columns: 1fr 1fr; } .arc-filters input { grid-column: 1 / -1; } }
.arc-list { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.arc-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px dashed var(--line); font-size: 14px; }
.arc-row:last-child { border-bottom: 0; }
.arc-row .meta { color: var(--ink-soft); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
.arc-row.has { opacity: .55; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--gold-soft); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 13px; background: var(--card); }
.pick button { border: 0; background: transparent; cursor: pointer; color: var(--bad); font-size: 14px; padding: 0 4px; }
.pick small { color: var(--ink-soft); }

.list-rows { display: grid; gap: 8px; }
.lrow { display: grid; gap: 8px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; align-items: center; }
.lrow.four { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.4fr) minmax(0, 1fr) auto; }
@media (max-width: 560px) { .lrow, .lrow.four { grid-template-columns: 1fr 1fr; } .lrow > :first-child { grid-column: 1 / -1; } }
.x { border: 1px solid var(--line); background: transparent; border-radius: var(--r); cursor: pointer; width: 30px; height: 30px; color: var(--bad); }

/* ---------- resumen ---------- */
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: 12px; }
.sumcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.sum-head { display: flex; gap: 12px; align-items: center; }
.sum-head .ph { width: 54px; height: 64px; border-radius: 27px 27px 4px 4px; background: var(--paper-2) center/cover no-repeat; border: 1px solid var(--gold-soft); flex: none; display: grid; place-items: center; font-family: var(--font-display); color: var(--gold); font-size: 20px; }
.sum-head h3 { font-family: var(--font-display); font-size: 17px; margin: 0; letter-spacing: .04em; }
.sum-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
.total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.total .lbl { margin: 0; }
.total strong { font-family: var(--font-display); font-size: 30px; font-variant-numeric: tabular-nums; color: var(--seal); letter-spacing: .02em; }
.meter { position: relative; height: 10px; border-radius: 99px; background: var(--paper-2); border: 1px solid var(--line); }
.meter .band { position: absolute; top: -1px; bottom: -1px; background: color-mix(in srgb, var(--ok) 35%, transparent); border: 1px solid var(--ok); border-radius: 99px; }
.meter .mark { position: absolute; top: -5px; width: 3px; height: 18px; background: var(--seal); border-radius: 2px; transform: translateX(-1px); }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.status { font-size: 13px; font-weight: 600; }
.status.ok { color: var(--ok); } .status.bajo { color: var(--info); } .status.alto { color: var(--bad); }
.warns { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.warns li { padding-left: 14px; position: relative; }
.warns li::before { content: ""; position: absolute; left: 0; top: .5em; width: 7px; height: 7px; border-radius: 50%; background: var(--info); }
.warns li.warn::before { background: var(--warn); }
.warns li.pend::before { background: var(--bad); border-radius: 1px; }
.cgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cgrid div { text-align: center; border: 1px solid var(--line); border-radius: var(--r); padding: 5px 2px; background: var(--paper); }
.cgrid b { display: block; font-family: var(--font-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.cgrid span { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.costs { display: grid; gap: 3px; font-size: 13px; }
.costs div { display: flex; justify-content: space-between; gap: 10px; }
.costs span:last-child { font-variant-numeric: tabular-nums; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn.primary { grid-column: 1 / -1; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--on-accent); padding: 9px 16px; border-radius: var(--r); font-size: 14px; z-index: 30; border: 1px solid var(--gold-soft); max-width: calc(100% - 32px); }

/* ---------- biblioteca ---------- */
.lib-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.lib-tools input { max-width: 340px; }
.lib-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.lib-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 12px; }
.lib-card .ph { grid-row: span 3; width: 56px; height: 68px; border-radius: 28px 28px 4px 4px; background: var(--paper-2) center/cover no-repeat; border: 1px solid var(--gold-soft); display: grid; place-items: center; font-family: var(--font-display); color: var(--gold); }
.lib-card h3 { margin: 0; font-family: var(--font-display); font-size: 15px; letter-spacing: .03em; overflow-wrap: anywhere; }
.lib-card p { margin: 0; font-size: 13px; color: var(--ink-soft); }
.lib-card .row { grid-column: 1 / -1; margin-top: 6px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 26px; text-align: center; color: var(--ink-soft); }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }

/* ---------- ajustes (modal) ---------- */
.modal-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--card); border: 1px solid var(--gold-soft); border-radius: var(--r); max-width: 560px; width: 100%; padding: 18px; display: grid; gap: 14px; max-height: 90vh; overflow: auto; }
.modal h2 { font-family: var(--font-display); font-size: 16px; letter-spacing: .1em; margin: 0; text-transform: uppercase; }

/* ---------- vista expediente ---------- */
.exp-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.exp-stage { background: var(--surface-2); border: 1px solid var(--line); padding: 22px 12px; border-radius: var(--r); overflow-x: auto; }

.field > label.check { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 400; }

/* selector de tema y adornos (PAM) */
.theme-wrap { position: relative; }
.theme-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 13px; cursor: pointer; }
.theme-btn i, .theme-opt i { width: 22px; height: 22px; border-radius: 50%; display: inline-block; flex: none; border: 1px solid var(--line); }
.theme-btn .car { color: var(--muted); font-size: .8em; }

    let n = String(name).replace(/\*+/g, '').replace(/\s*>\s*/g, ' > ').replace(/\s+/g, ' ').trim();
    n = n.replace(/\(Categoría a elegir\)/i, '_____');

    // "Biblioteca Cultura Mágica > Hogwarts" -> {tipo:'Biblioteca', resto:'Cultura Mágica > Hogwarts', especifico:true}

      if (mx - mn <= 1) break;
      D.atributos.forEach(a => { if (lim[a] === mn) lim[a]++; });
    }
    const aumentos = D.atributos.reduce((s, a) => s + Math.max(0, lim[a] - etLim[a]), 0);
    D.atributos.forEach(a => { if (tal.has(a)) lim[a] = 7; });
    if (aumentos > 0) W.push({ t: 'info', m: 'Con los límites de la etapa ' + etapa.n + ' necesita ' + aumentos + ' aumento' + (aumentos > 1 ? 's' : '') + ' de límite (' + thousands(aumentos * C.aumentoLimite) + ' grageas' + (st.contarLimites ? ', sumadas al total' : ', no suman al total') + ').' });

    // --- habilidades: lista final ---
    const skillList = [];
    Object.keys(skills).forEach(k => {
      const s = skills[k];
      if (!s.lvl) return;
      const a = skillAttr(D, s.skill);
      const bono = C.bonoHabilidad[s.lvl];
      const racial = (strip(st.ident.raza).includes('semigigant') && a === 'Vigor') ? 2 : 0;
      const total = (attrs[a] || 0) + bono + racial;
      const label = s.skill === 'Arte' ? 'Arte (' + (s.esp || 'a elegir') + ')' : s.skill;
      skillList.push({ key: k, skill: s.skill, esp: s.esp, label, attr: a, lvl: s.lvl, bono, racial, total, nivel: C.nivelHabilidad[s.lvl], tier: tierOf(D, total), base: baseSkills[k] || 0, fromJob: s.fromJob });
    });
    const attrOrder = a => D.atributos.indexOf(a);
    const skillOrder = (s) => D.habilidades[s.attr].indexOf(s.skill);
    skillList.sort((x, y) => attrOrder(x.attr) - attrOrder(y.attr) || skillOrder(x) - skillOrder(y) || x.label.localeCompare(y.label));
    function bonoOf(skill) {
      let b = 0;
      skillList.forEach(s => { if (s.skill === skill) b = Math.max(b, s.bono); });
      return b;
    }

    // --- trasfondos ---
    const trasList = Object.values(tras).map(t => {
      const p = trasParts(t.name);
      const cost = (p.especifico ? C.trasfondoEspecifico : C.trasfondoGeneral).slice(1, t.lvl + 1).reduce((s, x) => s + x, 0);
      return { name: t.name, label: trasLabel(t.name), lvl: t.lvl, roman: ROMAN[t.lvl] || t.lvl, especifico: p.especifico, tipo: p.tipo, cost, base: baseTras[strip(t.name)] || 0, fromJob: t.fromJob, pendiente: /_{2,}/.test(t.name) };
    });
    const tOrder = ['Biblioteca', 'Informantes', 'Influencia', 'Seguidores'];
    trasList.sort((x, y) => tOrder.indexOf(x.tipo) - tOrder.indexOf(y.tipo) || (x.especifico - y.especifico) || x.name.localeCompare(y.name));
    const ventList = Object.values(vent).map(t => {
      const base = t.name.replace(/\s+[IVX]+$/, '');
      const cost = C.ventaja.slice(1, t.lvl + 1).reduce((s, x) => s + x, 0);
      return { name: base, label: base, lvl: t.lvl, roman: ROMAN[t.lvl], cost, fromJob: t.fromJob };
    });

    // --- idiomas ---
    const idiomaList = [];
    idiomaList.push({ nombre: st.nativo || 'Inglés', tipo: 'muggle', nivel: 'nativo', coste: 0, slot: null });
    ['muggle', 'magico'].forEach(scope => {
      langReq[scope].forEach((lv, i) => {
        const key = scope + i;
        const nombre = (st.idiomaSlots || {})[key] || '';
        const coste = C.idioma[scope] * LANG_LV[lv];
        if (!nombre) P.push({ key: 'lang:' + key, m: 'Elige el idioma ' + (scope === 'magico' ? 'mágico' : 'muggle') + ' de nivel ' + lv });
        else if (strip(nombre) === strip(st.nativo)) W.push({ t: 'warn', m: 'El idioma nativo no cuenta para los requisitos del empleo (' + nombre + ').' });
        idiomaList.push({ nombre: nombre || '(por elegir)', tipo: scope, nivel: lv, coste, slot: key, pendiente: !nombre });
      });
    });
    (st.idiomas || []).forEach(x => {
      if (!x || !x.nombre) return;
      const scope = x.tipo === 'magico' ? 'magico' : 'muggle';
      idiomaList.push({ nombre: x.nombre, tipo: scope, nivel: x.nivel || 'bajo', coste: C.idioma[scope] * (LANG_LV[x.nivel] || 1), slot: null });
    });

    // --- arcanos ---
    const chosen = (st.arcanos || []).filter(Boolean);
    const arcCost = chosen.reduce((s, a) => s + (C.arcano[a.v] || 0), 0);
    const arcStatus = [];
    let missingCost = 0;
    Object.values(arcReq).forEach(r => {
      const letter = catLetterFromHeader(r.cat);
      const pool = chosen.filter(a => a.v !== 'Doméstico' && (!letter || a.c === letter || (a.c || '').includes(letter)) && (r.scope !== 'pocion-ritual' || a.t !== 'Hechizo'));
      const cA = pool.filter(a => a.v === 'Avanzado').length;
      const cI = pool.filter(a => a.v === 'Intermedio').length;
      const cB = pool.filter(a => a.v === 'Básico').length;
      const nA = r.avanzado, nI = r.intermedio, nB = Math.max(r.basico, r.total - r.intermedio - r.avanzado);
      const fA = Math.max(0, nA - cA);
      const fI = Math.max(0, nI - (cI + Math.max(0, cA - nA)));
      const extraHigh = Math.max(0, cA - nA) + Math.max(0, cI - nI);
      const fB = Math.max(0, nB - (cB + Math.max(0, extraHigh - Math.max(0, nI - cI))));
      const label = r.cat || (r.scope === 'pocion-ritual' ? 'Pociones o rituales' : 'Arcanos');
      arcStatus.push({ label, nA, nI, nB, cA, cI, cB, fA, fI, fB, ok: !fA && !fI && !fB });
      missingCost += fA * C.arcano['Avanzado'] + fI * C.arcano['Intermedio'] + fB * C.arcano['Básico'];
      if (fA || fI || fB) P.push({ key: 'arc', m: label + ': faltan ' + [fB && fB + ' básico' + (fB > 1 ? 's' : ''), fI && fI + ' intermedio' + (fI > 1 ? 's' : ''), fA && fA + ' avanzado' + (fA > 1 ? 's' : '')].filter(Boolean).join(', ') });
    });
    ['Hechizo', 'Poción', 'Ritual'].forEach(t => {
      const b = chosen.filter(a => a.t === t && a.v === 'Básico').length;
      const i = chosen.filter(a => a.t === t && a.v === 'Intermedio').length;
      const a = chosen.filter(x => x.t === t && x.v === 'Avanzado').length;
      if (i > b) W.push({ t: 'warn', m: t + ': hay más intermedios (' + i + ') que básicos (' + b + ').' });
      if (a > i) W.push({ t: 'warn', m: t + ': hay más avanzados (' + a + ') que intermedios (' + i + ').' });
    });
    const domCount = chosen.filter(a => a.v === 'Doméstico').length;

    // --- talentos, especializaciones, objetos, títulos ---
    const talentoList = [];
    if (maestrias) talentoList.push({ n: 'Maestría en [Animal Muggle o Bestia Mágica]' + (maestrias > 1 ? ' ×' + maestrias : ''), c: 100 * maestrias, fromJob: true });
    (st.talentos || []).forEach(t => { if (t && t.n) talentoList.push({ n: t.n + (t.nota ? ' (' + t.nota + ')' : ''), c: +t.c || 0 }); });
    canjes.forEach(c => talentoList.push({ n: c.n + ' ×' + c.cant, c: c.cant * c.coste, fromJob: true }));
    const espList = []; let espN = 0;
    D.especializaciones.forEach(e => { const n = +(st.esp || {})[e] || 0; if (n) { espList.push({ n: e, lvl: n }); espN += n; } });
    const espCost = C.especializacionPaso * espN * (espN + 1) / 2;
    const objList = (st.objetos || []).filter(o => o && o.n).map(o => ({ n: o.n, nivel: o.nivel, c: o.nivel === 'Otro' ? (+o.c || 0) : (C.objeto[o.nivel] || 0) }));
    const tituloList = [];
    if (st.timos) tituloList.push({ n: 'TIMOs: ' + st.timos, c: C.timos[st.timos] || 0 });
    (st.extasis || []).forEach(x => { if (x && x.asig && x.nota) tituloList.push({ n: 'EXTASIS ' + x.asig + ': ' + x.nota, c: C.extasis[x.nota] || 0 }); });

    // --- costes ---
    const sumAttr = a => C.atributo.slice(1, attrs[a] + 1).reduce((s, x) => s + x, 0);
    const cost = {};
    const items = (arr) => arr;
    cost.raza = { label: 'Raza', total: (C.raza[st.ident.raza] || 0) + (st.ident.licantropia ? C.licantropia : 0), items: [] };
    if (C.raza[st.ident.raza]) cost.raza.items.push(st.ident.raza + ' (' + thousands(C.raza[st.ident.raza]) + ')');
    if (st.ident.licantropia) cost.raza.items.push('Licantropía (' + C.licantropia + ')');
    cost.atributos = { label: 'Atributos', total: 0, items: [] };
    D.atributos.forEach(a => { if (attrs[a]) { const c = sumAttr(a); cost.atributos.total += c; cost.atributos.items.push(a + ' ' + attrs[a] + ' (' + thousands(c) + ')'); } });
    cost.habilidades = { label: 'Habilidades', total: 0, items: [] };
    skillList.forEach(s => {
      const tbl = s.skill === 'Arte' ? C.arte : C.habilidad;
      const c = tbl.slice(1, s.lvl + 1).reduce((x, y) => x + y, 0);
      s.cost = c; cost.habilidades.total += c; cost.habilidades.items.push(s.label + ' ' + s.nivel + ' (' + thousands(c) + ')');
    });
    cost.trasfondos = { label: 'Trasfondos y ventajas', total: 0, items: [] };
    trasList.concat(ventList).forEach(t => { cost.trasfondos.total += t.cost; cost.trasfondos.items.push((t.tipo ? t.name : t.label) + ' ' + t.roman + ' (' + thousands(t.cost) + ')'); });
    const idCost = idiomaList.reduce((s, x) => s + x.coste, 0);
    cost.idiomas = { label: 'Idiomas', total: idCost, items: idiomaList.filter(x => x.coste).map(x => x.nombre + ' ' + x.nivel + ' (' + x.coste + ')') };
    cost.titulos = { label: 'Títulos académicos', total: tituloList.reduce((s, x) => s + x.c, 0), items: tituloList.map(x => x.n + ' (' + x.c + ')') };
    cost.especializaciones = { label: 'Especializaciones', total: espCost, items: espList.map(e => e.n + ' ' + e.lvl) };
    cost.talentos = { label: 'Talentos', total: talentoList.reduce((s, x) => s + x.c, 0), items: talentoList.map(x => x.n + ' (' + thousands(x.c) + ')') };
    cost.talentosos = { label: 'Talentosos', total: tal.size * C.talentoso, items: [...tal].map(a => a + ' (' + thousands(C.talentoso) + ')') };
    const byTier = {};
    chosen.forEach(a => { byTier[a.v] = (byTier[a.v] || 0) + 1; });
    const arcItems = ['Doméstico', 'Básico', 'Intermedio', 'Avanzado'].filter(t => byTier[t]).map(t => byTier[t] + ' ' + t.toLowerCase() + (byTier[t] > 1 ? 's' : '') + ' × ' + C.arcano[t]);
    if (missingCost) arcItems.push('por elegir: ' + thousands(missingCost));
    cost.arcanos = { label: 'Arcanos', total: arcCost + missingCost, items: arcItems };
    cost.objetos = { label: 'Objetos y armas', total: objList.reduce((s, x) => s + x.c, 0), items: objList.map(o => o.n + ' (' + thousands(o.c) + ')') };
    cost.limites = { label: 'Aumentos de límite', total: st.contarLimites ? aumentos * C.aumentoLimite : 0, items: st.contarLimites && aumentos ? [aumentos + ' × ' + C.aumentoLimite] : [] };
    const total = Object.values(cost).reduce((s, c) => s + c.total, 0);

    // --- horquilla ---
    let horq = null;
    const main = jobsUsed.find(j => j.slot === 0) || jobsUsed[0];
    if (main && D.horquillas[main.job.sueldo]) {
      const h = D.horquillas[main.job.sueldo][main.nivel];
      horq = { min: h[0], max: h[1], tmax: h[2], job: main.job.nombre, nivel: D.niveles[main.nivel], sueldo: main.job.sueldo };
      horq.status = total < h[0] ? 'bajo' : total > h[1] ? 'alto' : 'ok';
      if (horq.status === 'bajo') W.push({ t: 'info', m: 'Por debajo de la horquilla de ' + main.job.nombre + ' ' + horq.nivel + ' (' + thousands(h[0]) + '–' + thousands(h[1]) + ').' });
      if (horq.status === 'alto') W.push({ t: 'warn', m: 'Por encima de la horquilla de ' + main.job.nombre + ' ' + horq.nivel + ' (' + thousands(h[0]) + '–' + thousands(h[1]) + ').' });
      if (tal.size > h[2]) W.push({ t: 'warn', m: 'Tiene ' + tal.size + ' Talentoso' + (tal.size > 1 ? 's' : '') + '; el máximo para sueldo ' + main.job.sueldo + ' ' + horq.nivel + ' es ' + h[2] + '.' });
    }
    tal.forEach(a => { if (!(st.justif || {})[a] || !(st.justif[a] + '').trim()) W.push({ t: 'warn', m: 'Talentoso de ' + a + ' sin justificar en la historia' + (talAuto.has(a) ? ' (lo exige un valor de la ficha)' : '') + '.' }); });
    jobsUsed.forEach(j => {
      if (!j.job.reqs.length) W.push({ t: 'info', m: j.job.nombre + ' no tiene requisitos cargados en el directorio: la ficha queda a criterio del máster.' });
      const order = ['Infante', 'Adolescente', 'Joven', 'Adulto', 'Experimentado', 'Veterano'];
      if (false) {}
      if (j.job.etapa_min && order.indexOf(st.ident.etapa) < order.indexOf(j.job.etapa_min)) W.push({ t: 'warn', m: j.job.nombre + ' pide etapa mínima ' + j.job.etapa_min + '.' });
      if (!j.job.oficial) W.push({ t: 'info', m: j.job.nombre + ' es un empleo no oficial.' });
    });

    // --- combate (Sistema + Calculadora de stats de combate de PAM) ---
    const A = attrs, adj = st.combAdj || {};
    const raza = strip(st.ident.raza).replace(/[^a-z]/g, '');
    const has = n => { const k = strip(n); return (st.objetos || []).some(o => o && strip(o.n).includes(k)) || chosen.some(a => strip(a.n).includes(k)); };
    const M = { semiD: raza.includes('semiduend'), semiG: raza.includes('semigigant'), semiV: raza.includes('semiveel'), meta: raza.includes('metamorfomag'), lic: !!st.ident.licantropia,
      carstein: has('Anillo de los Carstein'), warlockObj: has('Armadura de Warlock'), maletin: has('Maletín del pocionista'), bisu: has('Bisutería Arcana'),
      herbiObj: has('Herbivicus'), herbicida: has('Poción herbicida'), vitae: has('Planta Vitae'), solucion: has('Solución del ritualista'), altar: has('Altar del ritualista') };
    const warl = M.warlockObj && !!st.warlockPuesta;
    function combat(opt) {
      opt = opt || {};
      const fz = +opt.fuerza || 0, act = opt.actividad ? 1 : 0, L4 = opt.lic ? 4 : 0;
      const V = A['Vigor'] + fz, P = A['Percepción'], Dx = A['Destreza'], Wv = A['Voluntad'], Po = A['Poder'];
      const vUmb = M.semiD ? Math.floor(V / 2) : V;
      const vPA = M.carstein ? 0 : vUmb * (M.semiG ? 3 : 1);
      const c = {};
      const ex = (n, l) => n ? ' ' + (n > 0 ? '+ ' : '− ') + Math.abs(n) + ' (' + l + ')' : '';
      c.ini = P + bonoOf('Iniciativa') + L4 - (warl ? 2 : 0) + act + (+adj.ini || 0);
      c.atqF = V + bonoOf('Pelea') + L4 + (M.semiG ? 2 : 0) + (+adj.atqF || 0);
      c.def = 5 + Dx + bonoOf('Esquiva') + L4 - (warl ? 2 : 0) + act + (+adj.def || 0);
      c.atqM = Po + bonoOf('Duelo') + (+adj.atqM || 0);
      c.defD = 5 + Wv + bonoOf('Frialdad');
      c.luchaFx = (c.atqF + c.def - 5 + c.ini) / 3; c.luchaMx = (c.atqM + c.def - 5 + c.ini) / 3;
      c.luchaF = Math.round(c.luchaFx); c.luchaM = Math.round(c.luchaMx);
      c.pa = (etapa.pa + vPA + Wv) * (opt.lic ? 2 : 1) + (+adj.pa || 0);
      c.umbral = etapa.umbral + vUmb + L4 + (+adj.umbral || 0);
      c.umbralAc = Math.ceil(c.umbral / 2);
      c.heridas = etapa.heridas + Wv + (opt.lic ? 2 : 0) + (+adj.heridas || 0);
      const vigTxt = fz ? 'Vigor (' + A['Vigor'] + ' + ' + fz + ' poción)' : 'Vigor (' + A['Vigor'] + ')';
      c.t = {
        ini: 'Percepción (' + P + ') + Iniciativa (' + bonoOf('Iniciativa') + ')' + ex(warl ? -2 : 0, 'Armadura de Warlock') + ex(act, 'Poción de actividad') + ex(L4, 'Licantropía') + ex(+adj.ini || 0, 'ajuste'),
        atqF: vigTxt + ' + Pelea (' + bonoOf('Pelea') + ')' + ex(M.semiG ? 2 : 0, 'Semigigante') + ex(L4, 'Licantropía') + ex(+adj.atqF || 0, 'ajuste'),
        atqM: 'Poder (' + Po + ') + Duelo (' + bonoOf('Duelo') + ')' + ex(+adj.atqM || 0, 'ajuste'),
        def: '5 + Destreza (' + Dx + ') + Esquiva (' + bonoOf('Esquiva') + ')' + ex(warl ? -2 : 0, 'Armadura de Warlock') + ex(act, 'Poción de actividad') + ex(L4, 'Licantropía') + ex(+adj.def || 0, 'ajuste'),
        defD: '5 + Voluntad (' + Wv + ') + Frialdad (' + bonoOf('Frialdad') + ')',
        luchaF: '(Ataque Físico (' + c.atqF + ') + Defensa (' + c.def + ') − 5 + Iniciativa (' + c.ini + ')) / 3',
        luchaM: '(Ataque Mágico (' + c.atqM + ') + Defensa (' + c.def + ') − 5 + Iniciativa (' + c.ini + ')) / 3',
        pa: (opt.lic ? '(' : '') + 'Base (' + etapa.pa + ') + ' + (M.carstein ? 'Vigor (0, Anillo de los Carstein)' : M.semiG ? 'Vigor × 3 (' + vPA + ', Semigigante)' : M.semiD ? 'Vigor ÷ 2 (' + vPA + ', Semiduende)' : vigTxt) + ' + Voluntad (' + Wv + ')' + (opt.lic ? ') × 2 (Licantropía)' : '') + ex(+adj.pa || 0, 'ajuste'),
        umbral: 'Base (' + etapa.umbral + ') + ' + (M.semiD ? 'Vigor ÷ 2 (' + vUmb + ', Semiduende)' : vigTxt) + ex(L4, 'Licantropía') + ex(+adj.umbral || 0, 'ajuste'),
        heridas: 'Base (' + etapa.heridas + ') + Voluntad (' + Wv + ')' + ex(opt.lic ? 2 : 0, 'Licantropía') + ex(+adj.heridas || 0, 'ajuste')
      };
      return c;
    }
    const cb = combat({});
    // puntos de pociones y rituales
    const lvIdx = sk => { let l = 0; skillList.forEach(s => { if (s.skill === sk) l = Math.max(l, s.lvl); }); return Math.min(4, l); };
    const bp = bonoOf('Pociones'), br = bonoOf('Rituales'), Po = A['Poder'];
    let pp = Po + bp, ppT = ['Poder (' + Po + ')', 'Pociones (' + bp + ')'];
    if (M.maletin) { pp *= 2; ppT = ['(' + ppT.join(' + ') + ') × 2 (Maletín del pocionista inquieto)']; }
    const herb = lvIdx('Herbología'), ritL = lvIdx('Rituales');
    const herbiOn = M.herbiObj && st.herbivicus !== false;
    if (herbiOn && herb) { pp += herb; ppT.push(herb + ' (Herbivicus)'); }
    if (M.herbicida && herb) { pp += herb; ppT.push(herb + ' (Poción herbicida)'); }
    if (M.vitae && ritL) { pp += ritL; ppT.push(ritL + ' (Planta Vitae)'); }
    let pr = Po + br, prT = ['Poder (' + Po + ')', 'Rituales (' + br + ')'];
    if (M.bisu) { pr = Po + br * 2; prT = ['Poder (' + Po + ')', 'Rituales (' + br + ') × 2 (Bisutería Arcana)']; }
    if (M.solucion && bp) { pr += bp; prT.push(bp + ' (Solución del ritualista)'); }
    const art = Math.min(4, skillList.filter(s => s.skill === 'Arte').reduce((m, s) => Math.max(m, s.lvl), 0));
    if (M.altar && art) { pr += art; prT.push(art + ' (Altar del ritualista)'); }
    cb.poc = pp; cb.rit = pr; cb.t.poc = ppT.join(' + '); cb.t.rit = prT.join(' + ');
    cb.etapa = etapa; cb.M = M; cb.warl = warl;
    cb.lic = M.lic ? combat({ lic: true }) : null;
    const esc0 = st.escena || {};
    cb.escena = (+esc0.fuerza || esc0.actividad) ? combat({ fuerza: esc0.fuerza, actividad: esc0.actividad }) : null;
    // reglas de raza y objetos que se muestran
    const reglas = [];
    if (M.semiG) reglas.push('Semigigante: +2 a todas las tiradas de Vigor (incluido el Ataque Físico), cada punto de Vigor da 3 PA y no puede ser Derrotado con arcanos como Desmaius aunque tenga los PA bajo 0.');
    if (M.semiD) reglas.push('Semiduende: el Vigor se divide entre dos (hacia abajo) para PA y Umbral. Puede usar un artefacto de su creación por escena con Artesanía (Ingeniería) a 7 / 12 / 18 (básico / intermedio / avanzado), ' + A['Voluntad'] + ' veces por aventura (su Voluntad).');
    if (M.semiV) { const sed = 5 + A['Carisma'] + bonoOf('Seducción'); reglas.push('Semiveela: con Seducción +2 contra la Frialdad del objetivo lo encandila durante la escena; sus tiradas de Carisma contra esa persona usan como mínimo su valor de Seducción (' + (A['Carisma'] + bonoOf('Seducción')) + '). Pasivo de Seducción para resistirse: ' + sed + ' (+2 = ' + (sed + 2) + ').'); }
    if (M.meta) reglas.push('Metamorfomago: para hacerse pasar por otra persona tira Subterfugio +2 (+' + (A['Carisma'] + bonoOf('Subterfugio') + 2) + ') contra la dificultad que marque el máster.');
    if (M.lic) reglas.push('Licántropo: en luna llena suma +4 a Iniciativa, Ataque Físico, Defensa y Umbral, duplica los PA y gana 2 Heridas. Garras (2 por turno, 3 PA + sangrado de 1 PA por turno, heridas malditas) y Mordisco (solo a enemigos con PA negativos o derrotados: una Herida y contagio).');
    if (M.carstein) reglas.push('Anillo de los Carstein: el Vigor no suma PA. Si muere por heridas llevándolo, el anillo se apaga y cura una Herida (24 h de recarga).');

        items.push('<div class="pend-item' + (cur ? '' : ' todo') + '"><div class="what">' + esc(r.nombre.replace(/\*+/g, '')) + ' <b>' + esc(levelText(r, v)) + '</b><small>' + esc(J.nombre) + (slot ? ' (segundo empleo)' : '') + '</small></div><div class="row">' + ctrl + '</div></div>');
      });
    });
    // idiomas exigidos
    const langR = R ? R.langReq : { muggle: [], magico: [] };
    ['muggle', 'magico'].forEach(scope => langR[scope].forEach((lv, i) => {
      const key = scope + i; const cur = (st.idiomaSlots || {})[key] || '';
      const opts = scope === 'magico' ? D.idiomasMagicos : null;
      const ctrl = opts ? sel('idiomaSlots.' + key, [{ v: '', l: '— Elegir idioma mágico —' }].concat(opts), cur) : inp('idiomaSlots.' + key, cur, 'Francés, Alemán…', 'text', ' list="dl-idiomas"');
      items.push('<div class="pend-item' + (cur ? '' : ' todo') + '"><div class="what">Idioma ' + (scope === 'magico' ? 'mágico' : 'muggle') + ' <b>' + lv + '</b><small>Exigido por el empleo · el nativo no cuenta</small></div><div class="row">' + ctrl + '</div></div>');
    }));
    // arcanos
    const arc = R ? R.arcStatus : [];
    arc.forEach(a => items.push('<div class="pend-item' + (a.ok ? '' : ' todo') + '"><div class="what">' + esc(a.label) + ' <b>' + [a.nB && a.nB + ' básicos', a.nI && a.nI + ' intermedios', a.nA && a.nA + ' avanzados'].filter(Boolean).join(' · ') + '</b><small>' + (a.ok ? 'Cubiertos' : 'Faltan ' + [a.fB && a.fB + ' básicos', a.fI && a.fI + ' intermedios', a.fA && a.fA + ' avanzados'].filter(Boolean).join(', ')) + '</small></div><div class="row"><button class="btn sm" type="button" data-act="goto" data-arg="arcanos">Elegir arcanos</button></div></div>'));
    const acad = [];
    st.empleos.forEach(s => { const J = s.id && E.jobById(D, s.id); if (J) J.notas.filter(n => /TIMO|EXTASIS|Idioma/i.test(n)).forEach(n => acad.push(n)); });
    const nPend = R ? R.pending.length : 0;
    return section('huecos', 'III', 'Lo que deja por elegir el empleo', nPend ? '<span style="color:var(--warn)">' + nPend + ' pendiente' + (nPend > 1 ? 's' : '') + '</span>' : (items.length ? 'todo elegido' : ''),
      (items.length ? '<div class="pend">' + items.join('') + '</div>' : '<p class="muted">' + (st.empleos[0].id ? 'Este empleo no deja nada por elegir a este nivel.' : 'Elige un empleo para ver qué falta completar.') + '</p>') +
      (acad.length ? '<details class="notes"><summary>Títulos académicos que pide el empleo</summary><ul>' + acad.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul><p class="muted small">Añádelos en «Idiomas y títulos».</p></details>' : ''));
  }

    const vents = Object.keys(st.vent).map(n => field(n, sel('vent.' + n, [0, 1, 2, 3].map(x => ({ v: x, l: x ? ['I', 'II', 'III'][x - 1] + ' (' + T(D.costes.ventaja.slice(1, x + 1).reduce((s, y) => s + y, 0)) + ')' : 'No' })), st.vent[n]))).join('');

      '<div class="lbl">Habilidades</div>' + habTbl +
      '<div class="lbl">Talentosos</div><p class="muted small" style="margin:0">Un Talentoso sube el límite del atributo a 7 y permite habilidades en Maestro. Cada uno tiene que estar justificado en la historia del PNJ.</p><div class="grid two">' + tals + '</div>' +
      '<div class="lbl">Trasfondos</div>' + trasJob + '<div class="list-rows">' + trasRows + '</div><div><button class="btn sm" type="button" data-act="add" data-arg="tras">Añadir trasfondo</button></div>' +
      '<div class="lbl">Ventajas</div><div class="grid">' + vents + '</div>' +
      '<div class="lbl">Especializaciones</div><div class="grid">' + esps + '</div>' +
      '<div class="lbl">Talentos</div><div class="list-rows">' + talRows + '</div><div><button class="btn sm" type="button" data-act="add" data-arg="talentos">Añadir talento</button></div>' +
      '<div class="lbl">Objetos y armas</div><div class="list-rows">' + objRows + '</div><div><button class="btn sm" type="button" data-act="add" data-arg="objetos">Añadir objeto</button></div>');
  }

  // ---------- eventos ----------
  function onBind(el) {
    const path = el.dataset.bind;
    let val = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number' || /^(empleos\.\d\.nivel|hab\.|vent\.|esp\.|tras\.\d+\.nivel)/.test(path)) val = el.type === 'number' ? (el.value === '' ? 0 : +el.value) : (isNaN(+val) ? val : +val);
    if (path === 'autor') { st.autor = val; cfg.autor = val; LS.set('pnj-config', cfg); }
    else setPath(st, path, val);
    if (/^objetos\.\d+\.n$/.test(path)) { const i = +path.split('.')[1]; const o = (D.objetos || []).find(x => E.strip(x.n) === E.strip(val)); if (o) st.objetos[i].nivel = o.v; }
    if (/^empleos\.\d\.id$/.test(path)) { const slot = +path.split('.')[1]; st.empleos[slot].nivel = st.empleos[slot].nivel || 0; }
    dirty = true; saveDraft();
    return !!el.dataset.rerender;
  }

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset && el.dataset.arcf) { arcFilter[el.dataset.arcf] = el.value; const keep = el.id; renderEditor(); const n = document.getElementById(keep); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (x) {} } return; }
    if (el.id === 'lib-q') { renderLib(); return; }
    if (el.dataset && el.dataset.bind && el.tagName !== 'SELECT' && el.type !== 'checkbox') { onBind(el); softRender(); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.arcf) return;
    if (el.dataset && el.dataset.actChange === 'tal-pick') {
      const i = +el.dataset.i; const t = D.talentos.find(x => x.n === el.value); st.talentos[i].n = el.value; if (t) st.talentos[i].c = t.c; saveDraft(); renderAll(); return;
    }
    if (el.dataset && el.dataset.act === 'tal') {
      const a = el.dataset.a; const set = new Set(st.talentosos || []); el.checked ? set.add(a) : set.delete(a); st.talentosos = [...set]; saveDraft(); renderAll(); return;
    }
    if (el.dataset && el.dataset.bind) {
      const rer = onBind(el);
      if (rer || el.tagName === 'SELECT' || el.type === 'checkbox') renderAll(); else softRender();
    }
  });
  document.addEventListener('toggle', e => {
    const d = e.target; if (!d.classList || !d.classList.contains('sec')) return;
    const id = d.id.replace('sec-', ''); d.open ? openSecs.add(id) : openSecs.delete(id); LS.set('pnj-secciones', [...openSecs]);
  }, true);

  document.addEventListener('click', e => {
    const tab = e.target.closest('.tab'); if (tab) { switchView(tab.dataset.view); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, arg = b.dataset.arg;
    if (b.tagName === 'INPUT' && b.type === 'checkbox') return; // gestionado en change
    switch (act) {
      case 'nivel': st.empleos[+b.dataset.slot].nivel = +b.dataset.n; break;
      case 'atr': { const a = b.dataset.a; const cur = R.attrs[a]; const base = R.baseAttrs[a]; st.atr[a] = Math.max(base, Math.min(7, cur + (+b.dataset.d))); if (st.atr[a] === base) delete st.atr[a]; break; }
      case 'add': {
        const def = { idiomas: { nombre: '', tipo: 'muggle', nivel: 'bajo' }, extasis: { asig: '', nota: 'Supera las Expectativas' }, tras: { nombre: '', nivel: 1 }, talentos: { n: '', c: 0, nota: '' }, objetos: { n: '', nivel: 'Básico', c: 0 }, difs: { hab: 'Alerta', etiqueta: '' } }[arg];
        if (!Array.isArray(st[arg])) st[arg] = []; st[arg].push(Object.assign({}, def)); break;
      }
      case 'del': { const [k, i] = arg.split('.'); st[k].splice(+i, 1); break; }
      case 'arte-add': { const v = ($('#new-arte').value || '').trim(); if (!v) { toast('Escribe la especialidad del Arte/Artesanía.'); return; } st.artes = st.artes || []; st.artes.push({ esp: v, nivel: 1 }); break; }
      case 'arc-add': { const [t, n] = arg.split('|'); const a = D.arcanos.find(x => x.t === t && x.n === n); if (a) st.arcanos.push(Object.assign({}, a)); break; }
      case 'arc-del': st.arcanos.splice(+arg, 1); break;
      case 'arc-custom': { const n = ($('#arc-new-n').value || '').trim(); if (!n) { toast('Escribe el nombre del arcano.'); return; } st.arcanos.push({ n, t: $('#arc-new-t').value, v: $('#arc-new-v').value, c: '' }); break; }
      case 'goto': { openSecs.add(arg); renderAll(); const el = document.getElementById('sec-' + arg); if (el) { el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
      case 'difs-custom': st.difs = R.difs.map(d => ({ hab: d.hab, etiqueta: d.etiqueta })); break;
      case 'difs-auto': st.difs = null; break;
      case 'save': savePNJ(); return;
      case 'view-exp': switchView('exp'); return;
      case 'new': st = E.newState(); st.autor = cfg.autor; arcFilter = { q: '', t: '', v: '', c: '' }; break;
      case 'dup': st = JSON.parse(JSON.stringify(st)); st.id = ''; st.ident.nombre = (st.ident.nombre || '') + ' (copia)'; toast('Copia creada: cámbiale el nombre y guárdala'); break;
      case 'lib-open': openPNJ(arg); return;
      case 'lib-del': confirmDel = arg; renderLib(); return;
      case 'lib-del-no': confirmDel = null; renderLib(); return;
      case 'lib-del-yes': deletePNJ(arg); return;
      case 'modal-close': $('#modal-root').innerHTML = ''; return;
      case 'modal-close-bg': if (e.target === b) $('#modal-root').innerHTML = ''; return;
      case 'set-save': {
        cfg.scriptUrl = $('#set-url').value.trim(); cfg.clave = $('#set-clave').value.trim(); cfg.autor = $('#set-autor').value.trim();
        if (cfg.scriptUrl && !/^https:\/\/script\.google(usercontent)?\.com\//.test(cfg.scriptUrl)) { toast('La URL tiene que empezar por https://script.google.com/'); return; }
        LS.set('pnj-config', cfg); $('#modal-root').innerHTML = ''; libLoaded = false; D = window.PNJ_DATA_DEFAULT; dataSource = 'integrados'; renderAll(); loadRemoteData(); toast(cfg.scriptUrl ? 'Conexión guardada' : 'Usando solo este navegador'); return;
      }
      default: return;
    }
    saveDraft(); renderAll();
  });
  $('#btn-settings').addEventListener('click', openSettings);
  $('#lib-refresh').addEventListener('click', refreshLib);
  $('#btn-print').addEventListener('click', () => { renderExp(); window.print(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) $('#modal-root').innerHTML = ''; });


  // ---------- temas (kit estético de PAM) ----------
  const SKINS = [
    { id: 'avadense', nombre: 'Avadense', orn: '✦', sw: 'linear-gradient(135deg,#171a2b,#262a42 45%,#B49768 75%,#A96879)', fx: ['✦', '☾', '✧', '✨'] },
    { id: 'pastel', nombre: 'Pastel Core', orn: '🌷', sw: 'linear-gradient(135deg,#D9F0E4,#E7DCF5 50%,#F7D6E0)', fx: ['🌷', '🌿', '🍬', '🌼', '🧺'] },
    { id: 'magic', nombre: 'Magic Girl', orn: '🦋', sw: 'linear-gradient(135deg,#6B62AE,#9B80A5 50%,#D6A6B9)', fx: ['🦋', '✦', '🌙', '💎', '🌸', '🫧', '✨', '🎀'] },
    { id: 'terror', nombre: 'Gothic Horror', orn: '🕯️', sw: 'linear-gradient(135deg,#241C29,#4A2638 50%,#8A3D4F)', fx: ['🕯️', '🥀', '🦇', '🕸️', '🗝️', '🌙'] },
    { id: 'neutro', nombre: 'Elegant Minimal', orn: '✦', sw: 'linear-gradient(135deg,#F4F0EA,#B8AEA5 50%,#3F3D3B)', fx: ['🪶', '✦', '🤍', '🌾', '🕯️'] },
    { id: 'magico', nombre: 'Enchanted Fantasy', orn: '🔮', sw: 'linear-gradient(135deg,#201B3A,#8065A5 55%,#E4D19A)', fx: ['✨', '💫', '🔮', '🌙', '🪶', '🦋', '💎', '🍄'] },
    { id: 'pixel', nombre: 'Pixel Core', orn: '⭐', sw: 'linear-gradient(135deg,#9B527A,#71936B 50%,#F0CF88)', fx: ['⭐', '🍄', '🌸', '💎', '🧪', '🪙', '✨', '🍓'] },
    { id: 'peony', nombre: 'Peony Garden', orn: '🌸', sw: 'linear-gradient(135deg,#9DAA85,#D8C595 35%,#E6AEA4 70%,#8E5963)', fx: ['🌸', '🌷', '🍃', '🌼'] },
    { id: 'matcha', nombre: 'Matcha Latte', orn: '🍵', sw: 'linear-gradient(135deg,#ABBF9B,#E4CDB0 45%,#A2663C 75%,#3F1D0E)', fx: ['🍵', '☕', '🥛', '🍃', '🧋'] },
    { id: 'lotus', nombre: 'Lotus Pond', orn: '🪷', sw: 'linear-gradient(135deg,#0F2E23,#798F53 40%,#C88582 70%,#1B5B65)', fx: ['🪷', '✨', '🍃', '💧', '🌸'] },
    { id: 'buttercup', nombre: 'Buttercup Morning', orn: '🌼', sw: 'linear-gradient(135deg,#FFF2B2,#FFE08A 40%,#A8C6E7 70%,#7FA8D6)', fx: ['🌼', '☁️', '☀️', '🧺', '🌾'] },
    { id: 'velvet', nombre: 'Velvet Library', orn: '📚', sw: 'linear-gradient(135deg,#1A0D0E,#45171B 35%,#733438 65%,#D5BCB5)', fx: ['📚', '🕯️', '🥀', '🗝️', '📜'] },
    { id: 'berries', nombre: 'Winter Berries', orn: '🍒', sw: 'linear-gradient(135deg,#0B2224,#336269 40%,#93D4D8 70%,#941D1D)', fx: ['🍒', '❄️', '🍃', '🫐'] },
    { id: 'tealplum', nombre: 'Teal & Plum', orn: '🍷', sw: 'linear-gradient(135deg,#0F4448 0 50%,#7A2A5A 50% 100%)', fx: ['🍷', '🌺', '🕯️', '📕', '🫖'] },
    { id: 'bubble', nombre: 'Bubble Dream', orn: '🫧', sw: 'linear-gradient(135deg,#102B53,#4E7AB1 40%,#CEB5D4 70%,#7D9FC0)', fx: ['🫧', '✨', '💫', '🫧', '💜'] }
  ];
  function applySkin(id) {
    const k = SKINS.find(x => x.id === id) || SKINS[0];
    document.documentElement.dataset.skin = k.id;
    LS.set('pnj-tema', k.id);
    const b = $('#theme-btn'); if (b) b.innerHTML = '<i style="background:' + k.sw + '"></i><span>' + esc(k.nombre) + '</span><span class="car">▾</span>';
    const fx = $('#fx-layer');
    if (fx) {
      let h = '';
      for (let i = 0; i < 14; i++) {
        const e = k.fx[i % k.fx.length];
        h += '<span style="left:' + ((i * 37 + 11) % 97) + '%;top:' + ((i * 53 + 7) % 92) + '%;animation-delay:-' + (i * 1.7).toFixed(1) + 's;font-size:' + (12 + (i * 7) % 14) + 'px">' + e + '</span>';
      }
      fx.innerHTML = h;
    }
    document.querySelectorAll('.theme-opt').forEach(o => o.setAttribute('aria-checked', String(o.dataset.skin === k.id)));
  }
  function renderThemeList() {
    $('#theme-list').innerHTML = SKINS.map(k => '<button type="button" class="theme-opt" role="menuitemradio" data-skin="' + k.id + '" aria-checked="false"><i style="background:' + k.sw + '"></i><span>' + esc(k.nombre) + '</span><span class="orn">' + k.orn + '</span></button>').join('');
  }
  renderThemeList();
  applySkin(LS.get('pnj-tema', 'avadense'));
  $('#theme-btn').addEventListener('click', e => { e.stopPropagation(); const l = $('#theme-list'); l.hidden = !l.hidden; $('#theme-btn').setAttribute('aria-expanded', String(!l.hidden)); });
  $('#theme-list').addEventListener('click', e => { const o = e.target.closest('.theme-opt'); if (!o) return; applySkin(o.dataset.skin); $('#theme-list').hidden = true; $('#theme-btn').setAttribute('aria-expanded', 'false'); });
  document.addEventListener('click', e => { if (!e.target.closest('.theme-wrap')) { const l = $('#theme-list'); if (l && !l.hidden) { l.hidden = true; $('#theme-btn').setAttribute('aria-expanded', 'false'); } } });

  // ---------- arranque ----------
  const draft = LS.get('pnj-borrador-v2', null);
  st = draft ? Object.assign(E.newState(), draft) : E.newState();
  st.autor = st.autor || cfg.autor;
  if (framed) { $('#btn-print').hidden = true; $('#print-note').textContent = 'En esta vista previa no se puede imprimir. Desde tu página de GitHub, el botón «Guardar como PDF» descarga el expediente en A4.'; }
  renderAll();
  loadRemoteData();
  window.addEventListener('beforeunload', () => saveDraft());
})();

</script>
